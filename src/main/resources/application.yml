spring:
  task:
    scheduling:
      pool:
        size: 2 # Lembretes e expiracao podem progredir independentemente.
  application:
    name: devolucao-magalu

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devolucao_magalu}
    username: ${DB_USER:devolucao}
    password: ${DB_PASSWORD:devolucao}

  jpa:
    hibernate:
      ddl-auto: validate # schema e controlado pelo Flyway, nao pelo Hibernate
    open-in-view: false # evita queries lazy "escondidas" na camada web
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  fuso-horario: ${APP_FUSO_HORARIO:America/Sao_Paulo}
  notificacoes:
    job-ativo: ${NOTIFICACOES_JOB_ATIVO:true}
    antecedencia-minutos: 120
    intervalo-ms: 300000
    tamanho-lote: 200
    max-lotes-por-execucao: 50
  qrcode:
    validade-horas: 24
    tamanho-px: 300
    job-expiracao-ms: 300000 # 5 minutos
    tamanho-lote-expiracao: 100
    max-lotes-expiracao: 50

logging:
  level:
    com.magalu.devolucao: INFO

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
