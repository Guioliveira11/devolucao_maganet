services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devolucao_magalu
      POSTGRES_USER: devolucao
      POSTGRES_PASSWORD: devolucao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP usado pela aplicação
      - "8025:8025" # Interface para consultar e-mails de teste

volumes:
  postgres_data:
